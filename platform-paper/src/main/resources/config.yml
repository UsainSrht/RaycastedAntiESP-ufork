config-version: '2.0'
checks:
    player:
        enabled: true
        hide-sounds-when-hidden: true
        max-occluding-count: 3
        always-show-radius: 8
        raycast-radius: 128
        hide-on-spawn-distance: 24
        visible-recheck-interval-ticks: 5
        keep-client-entity-when-hidden: true
    entity:
        enabled: true
        hide-sounds-when-hidden: true
        max-occluding-count: 3
        always-show-radius: 8
        raycast-radius: 92
        hide-on-spawn-distance: 24
        visible-recheck-interval-ticks: 5
        keep-client-entity-when-hidden: true
    tile-entity:
        enabled: true
        max-occluding-count: 3
        always-show-radius: 8
        raycast-radius: 64
        hide-on-spawn-distance: 24
        visible-recheck-interval-ticks: -1
    sound-effects:
        enabled: true
        max-occluding-count: 3
        always-play-radius: 8
        raycast-radius: 48
    # Requires block-processor.track-all-blocks: true and a full restart.
    chunk-section:
        enabled: false
        max-occluding-count: 3
        # Horizontal Chebyshev only (chunks). Vertical is asymmetric: small down (caves), large up (hilltops).
        always-show-radius-chunks: 1
        always-show-vertical-down: 1
        always-show-vertical-up: 1
        raycast-radius-chunks: 10
        # How often visible sections are re-tested. 0/-1 = every tick (expensive). Prefer 5–10.
        visible-recheck-interval-ticks: 5
        # How often hidden sections are re-tested. 0/-1 = every tick. Prefer 10+.
        hidden-recheck-interval-ticks: 10
        hide-delay-ticks: 3
        neighbor-padding: true
        # true = hidden sections sent as empty air (default).
        # false = stone/deepslate solid placeholder (avoids stuck white chunk-fade on some clients when revealed).
        hide-as-air: true
engine:
    mode: async
    async:
        processing-threads: 1 # 1 thread is sufficient for hundreds of players, I do not recommend increasing this value blindly.
    netty:
block-processor:
    mode: packetevents
    track-all-blocks: false
    packetevents:
        tile-entity-exempted-ids:
            #- 9779 - Beacon ID on 1.21.11. To see what the beacon ID is for your server version, run the command "/antiesp print-block-ids". This will dump a massive list of all the block ID to block name mappings in the console. Search your logs for "beacon" (or whatever other tile entity you'd like to exempt) and add the associated ID here
        tile-entity-force-included-ids:
debug:
    info-level: 5
    info-exempted-classes:
    warn-level: 5
    warn-exempted-classes:
    error-level: 5
    error-exempted-classes:
    particles: false
    # Chunk-section ray visuals are toggled in-game: /antiesp debug-chunk-sections (not this flag).
    # Only paint HIDE rays for sections within this many section-Y steps below the viewer (deeper caves skipped).
    chunk-section-debug-vertical-down: 2
    timings: false
